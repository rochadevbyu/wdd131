<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Produto - WDD 131</title>
    <meta name="description" content="Formulário de avaliação de produto para o curso WDD 131.">
    <meta name="author" content="Roberto Ferreira da Rocha">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Yuyu+Short&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Revisão de Produto</h1>
    </header>

    <main>
        <form method="get" action="avaliacao.html" class="review-form">
            
            <label for="produto">Nome do Produto <span class="formulario">*</span></label>
            <select id="produto" name="produto" required>
                <option value="" disabled selected>Selecione um Produto ...</option>                
            </select>

            <fieldset class="rating-fieldset">
                <legend>Classificação Geral <span class="formulario">*</span></legend>
                <div class="estrela-container">
                    <div>
                        <label for="estrela1">☆</label><br>
                        <input type="radio" id="estrela1" name="rating" value="1" required>
                    </div>
                    <div>
                        <label for="estrela2">☆☆</label><br>
                        <input type="radio" id="estrela2" name="rating" value="2" required>
                    </div>
                    <div>
                        <label for="estrela3">☆☆☆</label><br>
                        <input type="radio" id="estrela3" name="rating" value="3" required>
                    </div>
                    <div>
                        <label for="estrela4">☆☆☆☆</label><br>
                        <input type="radio" id="estrela4" name="rating" value="4" required>
                    </div>
                    <div>
                        <label for="estrela5">☆☆☆☆☆</label><br>
                        <input type="radio" id="estrela5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <label for="data_instalacao">Data de Instalação <span class="formulario">*</span></label>
            <input type="date" id="data_instalacao" name="data_instalacao" required>

            <fieldset class="design-fieldset">
                <legend>Quais recursos você achou úteis no produto?<br><em>(Marque todos que se aplicam)</em></legend>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="rec_durabilidade" name="recursos" value="durabilidade">
                    <label for="rec_durabilidade">Durabilidade</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="rec_facilidade" name="recursos" value="facilidade">
                    <label for="rec_facilidade">Facilidade de Uso</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="rec_desempenho" name="recursos" value="desempenho">
                    <label for="rec_desempenho">Desempenho</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="rec_design" name="recursos" value="design">
                    <label for="rec_design">Design</label>
                </div>
            </fieldset>

            <label for="avaliacao_escrita">Avaliação Escrita <em>(Opcional)</em></label>
            <textarea id="avaliacao_escrita" name="avaliacao_escrita" rows="4"></textarea>

            <label for="nome_usuario">Seu Nome <em>(Opcional)</em></label>
            <input type="text" id="nome_usuario" name="nome_usuario">

            <input type="submit" value="Publicar Avaliação" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> - Roberto Ferreira da Rocha - Pernambuco</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
